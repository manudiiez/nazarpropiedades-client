# Staging (flujo-github): cada merge a `testing` corre los tests y, si pasan,
# publica la imagen :testing (+ :sha-<commit>). Adaptar según references/ci.md.
name: testing

on:
  push:
    branches: [testing]
  workflow_dispatch:

concurrency:
  group: testing
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  STAGING_TAG: testing

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # LayoutProps/PageProps son tipos globales que genera Next en .next/types/.
      # Sin typegen, tsc falla en CI porque .next/ viene vacío del checkout.
      - name: Generar tipos de rutas
        run: npx next typegen

      - name: Tipos
        run: npx tsc --noEmit

      # Todavía no hay runner de tests instalado; cuando lo haya, agregar acá el comando.
      - name: Tests
        run: npm test --if-present

      - name: Build
        run: npm run build

  image:
    name: image
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.STAGING_TAG }}
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
